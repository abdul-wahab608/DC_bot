name: Deploy to Bot-Hosting

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ --ignore=tests/performance -q
        env:
          PYTHONPATH: ${{ github.workspace }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      BH_DEPLOYMENT_ID: 5001cbaa-b245-4f90-80b5-395e163fbd36
    steps:
      - name: Pull latest code on Bot-Hosting and restart
        env:
          BH_KEY: ${{ secrets.BOT_HOSTING_API_KEY }}
        run: |
          if [ -z "$BH_KEY" ]; then echo "::error::BOT_HOSTING_API_KEY secret is not set"; exit 1; fi
          curl -fsS https://bot-hosting.net/api/mcp \
            -H "Authorization: Bearer $BH_KEY" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" \
            -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\",\"params\":{\"name\":\"deployments_sync\",\"arguments\":{\"id\":\"$BH_DEPLOYMENT_ID\"}}}" \
            | tee response.txt
          if grep -qE '"isError": ?true|"error": ?\{' response.txt; then
            echo "::error::Bot-Hosting sync failed"; exit 1
          fi
